[binaries]
c = '/opt/clang-p2996/bin/clang'
cpp = '/opt/clang-p2996/bin/clang++'
ar = '/opt/clang-p2996/bin/llvm-ar'
strip = '/opt/clang-p2996/bin/llvm-strip'

[built-in options]
cpp_args = ['-stdlib=libc++', '-nostdlib++']
cpp_link_args = [ '-L/opt/clang-p2996/lib/x86_64-unknown-linux-gnu', '-Wl,-Bstatic', '-lc++', '-lc++abi', '-lunwind', '-Wl,-Bdynamic', '-lpthread', '-ldl' ]
