[workspace]
resolver = "2"
members = [
  "crates/lovable-core",
  "crates/lovable-app",
  "crates/lovable-server",
  "crates/lovable-updater",
]


[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Sandboxedideas <info@sandboxedideas.com>"]
description = "Pets for your desktop"
homepage = "https://lovable.sandboxedideas.com"
repository = "https://github.com/kamenchunathan/scratches/tree/lovable"
license = "MIT"


[profile.release]
opt-level = 3
lto = "thin"
incremental = false
debug = false

[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
strip = "symbols"

[profile.dev.package."*"]
opt-level = 3
