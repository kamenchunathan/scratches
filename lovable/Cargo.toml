[package]
name = "lovable"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.16.1"
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.16"
tray-icon = "0.21.3"

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
incremental = false
debug = false
