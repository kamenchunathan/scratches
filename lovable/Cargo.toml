[workspace]
resolver = "2"
members = [
  "crates/lovable-core",
  "crates/lovable-app",
  "crates/lovable-worker",
  "crates/lovable-updater",
]


[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Sandboxedideas <info@sandboxedideas.com>"]
description = "Pets for your desktop"
homepage = "https://lovable.sandboxedideas.com"
repository = "https://github.com/kamenchunathan/scratches/tree/lovable"
license = "MIT"


[profile.release]
opt-level = 3
lto = "thin"
incremental = false
debug = false

[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
strip = "symbols"

[profile.dev.package."*"]
opt-level = 3

[workspace.dependencies]
hex = "0.4.3"
hmac = "0.12.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
